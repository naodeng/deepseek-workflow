name: Build & Release Alfred Workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.1.0 (defaults to a timestamped version)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="v${{ inputs.version }}"
          else
            VER="v$(date +%Y.%m.%d-%H%M%S)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Sync version into info.plist
        run: python3 tools/set_workflow_version.py "${{ steps.version.outputs.version }}"

      - name: Package DeepSeek.alfredworkflow
        run: |
          chmod +x Workflow/deepseek
          cd Workflow
          zip -q -r ../DeepSeek.alfredworkflow . -x "*.DS_Store"

      - name: Verify package
        run: python3 tools/verify_workflow.py DeepSeek.alfredworkflow

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" DeepSeek.alfredworkflow \
            --repo "${{ github.repository }}" \
            --title "DeepSeek Alfred Workflow ${{ steps.version.outputs.version }}" \
            --generate-notes
